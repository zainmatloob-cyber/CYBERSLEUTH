{% from "macros.html" import band_badge %}
<section class="metrics" id="summary" aria-label="Summary"{% if oob %} hx-swap-oob="true"{% endif %}>
  {% for label, value, sub in summary.metrics %}
  <div class="metric{% if loop.first %} metric-risk band-{{ band_class.get(summary.band, 'low') }}{% endif %}">
    <span class="metric-label">{{ label }}</span>
    <span class="metric-value">{{ value }}</span>
    {% if loop.first %}{{ band_badge(sub) }}{% elif sub %}<span class="metric-sub">{{ sub }}</span>{% endif %}
  </div>
  {% endfor %}
</section>
